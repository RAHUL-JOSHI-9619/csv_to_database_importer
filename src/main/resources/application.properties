spring.application.name=data_importer

# Preferred port. If it is busy, PortAvailabilityCustomizer picks a free one automatically.
server.port=8080

# ---- Gemini ----
# The key is read from the GEMINI_API_KEY system environment variable. It may be missing:
# the app still starts (see AiConfig) and page 1 then falls back to the non-AI steps.
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.2
# Our own round-based retry (app.ai.max-rounds) does the retrying, so keep Spring AI's short.
spring.ai.retry.max-attempts=2

# ---- AI column shortening (page 1) ----
# Master switch. false = skip AI and go straight to NLP / vowel removal / hashcode.
app.ai.enabled=true
# How many long column names go into ONE prompt.
app.ai.batch-size=40
# How many prompts are sent at the same time (one thread each). The free Gemini tier allows only
# a few requests per minute, so keep this low; raise it with a paid key.
app.ai.parallel-calls=2
# Hard timeout for every single AI call (seconds). Protects against a network that
# accepts the connection but never answers.
app.ai.timeout-seconds=30
# How many times names that are still too long are sent back to the AI (with feedback)
# before they fall back to NLP.
app.ai.max-rounds=4

# Where page 1 saves the column mapping file: <user home>/Downloads/<this folder>/<csv name>/
app.mapping.folder-name=Data_Importer

# Close the app when no browser tab has pinged for this many seconds.
app.heartbeat.timeout-seconds=90

# No database is configured at startup - the user types the connection in on page 2.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
